
{% extends "tasks/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-body">
        <h1>Delete Task?</h1>
        <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a class="btn btn-secondary" href="{% url 'task_detail' task.pk %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
