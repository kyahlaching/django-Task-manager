
{% extends "tasks/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="mb-4">{{ page_title }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-success" type="submit">Save Task</button>
            <a class="btn btn-secondary" href="{% url 'task_list' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
